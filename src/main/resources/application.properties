server.port=8082
spring.application.name=review-service
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
customer.service.url=${CUSTOMER_SERVICE_BASE_URL}/api/customers/review/
booking.service.url=${BOOKING_SERVICE_BASE_URL}/bookings/customer/review